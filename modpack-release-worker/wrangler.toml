name = "modpack-release"
main = "src/index.js"
compatibility_date = "2025-08-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "MODS_KV"
id = "e4d70dfbb2f64e898b1da0ea167e8104"

[[r2_buckets]]
