name = "modpack-release"
main = "src/index.js"
compatibility_date = "2025-08-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "MODS_KV"
id = "e4d70dfbb2f64e898b1da0ea167e8104"

[[r2_buckets]]
binding = "MODS_R2"
bucket_name = "modpack-mods"

[vars]
ADMIN_LOGIN = "maoxinhe"
BASE_URL = "https://releases.camzy.uno"
MAX_UPLOAD_MB = "100"
REPO_BRANCH = "main"
REPO_NAME = "modpack"
REPO_OWNER = "maoxinhe"
SESSION_TTL_HOURS = "168"
# ---- 工单系统邮件（Resend HTTP API）----
RESEND_API_KEY = "re_xxxxxxxxxxxx" # 请替换为你的 Resend API Key
MAIL_FROM = "工单系统 <noreply@camzy.uno>"
# 管理员收件邮箱（新工单通知）
ADMIN_EMAIL = "catkinr@qq.com"
