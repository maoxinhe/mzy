bucket_name = "modpack-mods"

[vars]
ADMIN_LOGIN = "maoxinhe"
BASE_URL = "https://releases.camzy.uno"
MAX_UPLOAD_MB = "100"
REPO_BRANCH = "main"
REPO_NAME = "modpack"
REPO_OWNER = "maoxinhe"
SESSION_TTL_HOURS = "168"
