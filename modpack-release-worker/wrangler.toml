name = "modpack-release"
main = "src/index.js"
compatibility_date = "2025-08-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "MODS_KV"
id = "e4d70dfbb2f64e898b1da0ea167e8104"

[[r2_buckets]]
binding = "MODS_R2"
bucket_name = "modpack-mods"

[[d1_databases]]
binding = "MODS_D1"
database_name = "modpack-release-db"
database_id = "b838b9e7-5ca1-416d-a420-307be040acb7"

[vars]
ADMIN_LOGIN = "maoxinhe"
BASE_URL = "https://releases.camzy.uno"
MAX_UPLOAD_MB = "100"
REPO_BRANCH = "main"
REPO_NAME = "modpack"
REPO_OWNER = "maoxinhe"
SESSION_TTL_HOURS = "168"
SSO_CLIENT_ID = "mzy_jzsmzjxn8r5pujj8"
# ---- 工单系统邮件（Resend HTTP API）----
MAIL_FROM = "工单系统 <noreply@camzy.uno>"
# 管理员收件邮箱（新工单通知）
ADMIN_EMAIL = "catkinr@qq.com"

[triggers]
crons = ["* * * * *"]

# 智能放置：worker 逻辑自动运行在离后端（GLM/GitHub/Resend/SSO）最近的节点，缩短后端往返延迟
# 静态资源仍始终从离访问者最近的节点提供，不受影响
[placement]
mode = "smart"
